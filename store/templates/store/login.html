{% extends 'base_cliente.html' %}
{% load static %}
{% block title %}Iniciar Sesión{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border">
                <div class="card-body p-4">
                    <h2 class="fw-bold mb-1 text-center">Iniciar Sesión</h2>
                    <p class="text-muted text-center mb-4">Accede a tu cuenta de GameStore</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Usuario</label>
                            <input type="text" name="username" class="form-control" placeholder="Tu usuario" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Contraseña</label>
                            <input type="password" name="password" class="form-control" placeholder="Tu contraseña" required>
                        </div>
                        <button type="submit" class="btn btn-accent w-100"><i class="bi bi-box-arrow-in-right"></i> Iniciar sesión</button>
                    </form>
                    <div class="text-center mt-3">
                        <p class="mb-1"><a href="{% url 'password_reset' %}" class="small">¿Olvidaste tu contraseña?</a></p>
                        <p class="mb-0">¿No tienes cuenta? <a href="{% url 'store:register' %}">Regístrate</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
