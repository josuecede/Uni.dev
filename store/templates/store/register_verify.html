{% extends 'base_cliente.html' %}
{% load static %}
{% block title %}Verificar Correo{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border">
                <div class="card-body p-4 text-center">
                    <i class="bi bi-shield-lock display-3" style="color:var(--gaming-primary);"></i>
                    <h2 class="fw-bold mt-3">Verifica tu correo</h2>
                    <p class="text-muted">Ingresa el código de 6 dígitos que enviamos a tu correo para activar tu cuenta.</p>
                    <form method="post" class="text-start mt-4">
                        {% csrf_token %}
                        <input type="hidden" name="email" value="{{ email }}">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Correo electrónico</label>
                            <p class="form-control-plaintext fw-bold" style="color:var(--gaming-text);">{{ email }}</p>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Código de 6 dígitos</label>
                            <input type="text" name="code" class="form-control" placeholder="000000" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="off" required>
                        </div>
                        <button type="submit" class="btn btn-accent w-100"><i class="bi bi-check-lg"></i> Verificar código</button>
                    </form>
                    <div class="mt-3">
                        <button id="btnResend" class="btn btn-outline-accent w-100" onclick="resendCode()" disabled>
                            <i class="bi bi-arrow-clockwise"></i> <span id="resendText">Reenviar código (5)</span>
                        </button>
                    </div>
                    <p class="mt-3 mb-0"><a href="{% url 'store:register' %}"><i class="bi bi-arrow-left"></i> Volver al registro</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
let cooldown = 5;
const btn = document.getElementById('btnResend');
const txt = document.getElementById('resendText');
const timer = setInterval(() => {
    cooldown--;
    if (cooldown <= 0) {
        clearInterval(timer);
        btn.disabled = false;
        txt.textContent = 'Reenviar código';
    } else {
        txt.textContent = 'Reenviar código (' + cooldown + ')';
    }
}, 1000);
function resendCode() {
    btn.disabled = true;
    txt.textContent = 'Enviando...';
    fetch('{% url "store:register_resend" %}', { method: 'POST', headers: { 'X-CSRFToken': '{{ csrf_token }}' } })
        .then(() => { txt.textContent = 'Código reenviado'; })
        .catch(() => { txt.textContent = 'Error al reenviar'; })
        .finally(() => { setTimeout(() => location.reload(), 1500); });
}
</script>
{% endblock %}
