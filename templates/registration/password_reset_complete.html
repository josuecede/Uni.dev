{% extends 'base.html' %}
{% block title %}Contraseña Restablecida{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border text-center">
            <div class="card-body py-5">
                <i class="bi bi-shield-check display-3" style="color:var(--gaming-primary);"></i>
                <h2 class="fw-bold mt-3">Contraseña restablecida</h2>
                <p class="text-muted">Tu contraseña ha sido cambiada exitosamente.</p>
                <a href="{% url 'store:login' %}" class="btn btn-accent"><i class="bi bi-box-arrow-in-right"></i> Iniciar sesión</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
