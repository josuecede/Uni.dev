{% extends 'base.html' %}
{% block title %}Ingresar Código{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border">
            <div class="card-body">
                <h2 class="fw-bold mb-3"><i class="bi bi-shield-lock"></i> Código de verificación</h2>
                <p class="text-muted">Ingresa el código de 6 dígitos que enviamos a tu correo.</p>
                {% if email %}<p class="small text-muted mb-3">Correo: <strong>{{ email }}</strong></p>{% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Código de 6 dígitos</label>
                        <input type="text" name="code" class="form-control" placeholder="000000" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="off" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-accent w-100"><i class="bi bi-check-lg"></i> Verificar código</button>
                </form>
                <div class="mt-3">
                    <button id="btnResend" class="btn btn-outline-accent w-100" onclick="resendCode()" disabled>
                        <i class="bi bi-arrow-clockwise"></i> <span id="resendText">Reenviar código (5)</span>
                    </button>
                </div>
                <p class="mt-3 mb-0"><a href="{% url 'password_reset' %}"><i class="bi bi-arrow-left"></i> Solicitar otro código</a></p>
            </div>
        </div>
    </div>
</div>
<script>
let cooldown = 5;
const btn = document.getElementById('btnResend');
const txt = document.getElementById('resendText');
const timer = setInterval(() => {
    cooldown--;
    if (cooldown <= 0) {
        clearInterval(timer);
        btn.disabled = false;
        txt.textContent = 'Reenviar código';
    } else {
        txt.textContent = 'Reenviar código (' + cooldown + ')';
    }
}, 1000);
function resendCode() {
    btn.disabled = true;
    txt.textContent = 'Enviando...';
    fetch('{% url "password_reset_resend" %}', { method: 'POST', headers: { 'X-CSRFToken': '{{ csrf_token }}' } })
        .then(() => { txt.textContent = 'Código reenviado'; })
        .catch(() => { txt.textContent = 'Error al reenviar'; })
        .finally(() => { setTimeout(() => location.reload(), 1500); });
}
</script>
{% endblock %}
