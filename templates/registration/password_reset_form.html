{% extends 'base.html' %}
{% block title %}Restablecer Contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border">
            <div class="card-body">
                <h2 class="fw-bold mb-3"><i class="bi bi-key"></i> Restablecer Contraseña</h2>
                <p class="text-muted">Ingresa tu correo electrónico y te enviaremos un código de verificación de 6 dígitos.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Correo electrónico</label>
                        <input type="email" name="email" class="form-control" placeholder="correo@ejemplo.com" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-accent"><i class="bi bi-send"></i> Enviar código</button>
                </form>
                <p class="mt-3 mb-0"><a href="{% url 'store:login' %}"><i class="bi bi-arrow-left"></i> Volver al inicio de sesión</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
