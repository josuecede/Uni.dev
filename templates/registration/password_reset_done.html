{% extends 'base.html' %}
{% block title %}Código Enviado{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border text-center">
            <div class="card-body py-5">
                <i class="bi bi-envelope-check display-3" style="color:var(--gaming-primary);"></i>
                <h2 class="fw-bold mt-3">Revisa tu correo</h2>
                <p class="text-muted">Si el correo existe, recibirás un código de verificación de 6 dígitos. Si no lo recibes en unos minutos, revisa tu carpeta de spam.</p>
                <a href="{% url 'password_reset_code_verify' %}" class="btn btn-accent"><i class="bi bi-key"></i> Ingresar código</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
