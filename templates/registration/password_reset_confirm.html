{% extends 'base.html' %}
{% block title %}Nueva Contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border">
            <div class="card-body">
                <h2 class="fw-bold mb-3"><i class="bi bi-lock"></i> Establecer nueva contraseña</h2>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">{{ field.label }}</label>
                        {{ field }}
                        {% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-accent"><i class="bi bi-check-lg"></i> Cambiar contraseña</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
