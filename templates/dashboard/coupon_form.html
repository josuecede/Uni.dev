{% extends 'starter.html' %}
{% load static %}
{% block title %}{{ title }} - Dashboard{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block breadcrumb %}Cupones{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-lg-6">
<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Código</label>
                <input type="text" name="code" class="form-control" value="{{ coupon.code|default:'' }}" required maxlength="20" placeholder="Ej: VERANO2026">
            </div>
            <div class="form-group">
                <label>Descuento %</label>
                <input type="number" name="discount_percent" class="form-control" value="{{ coupon.discount_percent|default:'' }}" required min="1" max="100">
            </div>
            <div class="form-group">
                <label>Válido Hasta</label>
                <input type="datetime-local" name="valid_until" class="form-control" value="{{ coupon.valid_until|date:'Y-m-d\TH:i'|default:'' }}" required>
            </div>
            <div class="form-group">
                <label>Usos Máximos</label>
                <input type="number" name="max_uses" class="form-control" value="{{ coupon.max_uses|default:'1' }}" required min="1">
            </div>
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{% url 'dashboard:coupon_list' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
</div>
</div>
{% endblock %}
